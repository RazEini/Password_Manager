[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razeini-password-manager"
version = "0.1.1"
dependencies = [
    "cryptography>=41.0.0",
    "pyperclip>=1.8.2",
    "rich",
    "questionary",
]

[project.scripts]
passmgr = "password_manager.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]