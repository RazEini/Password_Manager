[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razeini-password-manager"
version = "0.2.3"
description = "Secure, modular CLI/TUI password manager: Fernet encryption, PBKDF2 key derivation, atomic vault writes"
readme = "README.md"
authors = [{ name = "Raz Eini" }]
keywords = ["password-manager", "cli", "tui", "encryption", "fernet", "pbkdf2", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "pyperclip>=1.8.2",
    "rich",
    "questionary",
]

[project.urls]
Homepage = "https://github.com/RazEini/Password_Manager"
Source = "https://github.com/RazEini/Password_Manager"
Issues = "https://github.com/RazEini/Password_Manager/issues"
Changelog = "https://github.com/RazEini/Password_Manager/blob/main/CHANGELOG.md"

[project.scripts]
passmgr = "password_manager.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]